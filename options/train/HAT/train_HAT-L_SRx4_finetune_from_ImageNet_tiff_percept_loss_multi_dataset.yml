# general settings
name: train_HAT_SRx4_finetune_from_ImageNet_pretrain_perceptal_loss
model_type: HATModelTiff
scale: 4
num_gpu: auto
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: potamia_dataset_train
    type: TiffPairedImageMultiDataset
    dataroot_gt: '/home/luke/code/datasets/datasets/'
    dataroot_lq: '/home/luke/code/datasets/datasets/'
    dataroot_gts: ['/home/luke/code/datasets/datasets/sen2naipv2/hr/train','/home/luke/code/datasets/datasets/WorldStrat/hr/train', '/home/luke/code/datasets/datasets/breizhSR/hr/train'] #
    dataroot_lqs: ['/home/luke/code/datasets/datasets/sen2naipv2/lr/train', '/home/luke/code/datasets/datasets/WorldStrat/lr/train', '/home/luke/code/datasets/datasets/breizhSR/lr/train'] #
    io_backend:
      type: disk

    gt_size: 256
    lq_size: 64

    use_hflip: true
    use_rot: true
    use_cutmix: true
    use_mixup: true
    bands: bgr # specify the bands to use [bgr, bgnir, all]

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val_1:
    name: potamia_dataset_train
    type: TiffPairedImageMultiDataset
    dataroot_gt: '/home/luke/code/datasets/datasets/'
    dataroot_lq: '/home/luke/code/datasets/datasets/'
    dataroot_gts: ['/home/luke/code/datasets/datasets/sen2naipv2/hr/val','/home/luke/code/datasets/datasets/WorldStrat/hr/val', '/home/luke/code/datasets/datasets/breizhSR/hr/val']
    dataroot_lqs: ['/home/luke/code/datasets/datasets/sen2naipv2/lr/val', '/home/luke/code/datasets/datasets/WorldStrat/lr/val', '/home/luke/code/datasets/datasets/breizhSR/lr/val']
    io_backend:
      type: disk

    gt_size: 256
    lq_size: 64

    use_hflip: false
    use_rot: false
    use_cutmix: false
    use_mixup: false
    bands: bgr # specify the bands to use [bgr, bgnir, all]

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  # val_2:
